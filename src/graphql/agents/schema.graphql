type Message {
  content: String! @constraint(minLength: 1)
}

input AgentInput {
  message: String! @constraint(minLength: 1)
}

type AgentOutput {
  message: Message
  done: Boolean
}

extend type Subscription {
  onAgentMessage: AgentOutput
}

extend type Mutation {
  sendHumanMessage(input: AgentInput!): Message
}

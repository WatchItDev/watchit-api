type Post {
  id: ID!
  author: User!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime
  media: [MediaAttachment!]
  replyTo: Post
  quoteOf: Post
  visibility: VisibilitySetting!
}

type MediaAttachment {
  id: ID!
  url: String!
  type: MediaType!
}

enum MediaType {
  IMAGE
  VIDEO
  AUDIO
}

enum VisibilitySetting {
  PUBLIC
  FOLLOWERS_ONLY
  PRIVATE
}

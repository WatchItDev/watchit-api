scalar Timestamp

type SocialLink {
  platform: String
  url: String
}

type User {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLink]

  followersCount: Int!
  followingCount: Int!
  publicationsCount: Int!

  createdAt: Timestamp!
  updatedAt: Timestamp!
}

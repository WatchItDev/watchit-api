###########################
#      USERS SCHEMA       #
###########################

####################
#      TYPES       #
####################

type SocialLink {
  platform: String
  url: String
}

type User {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLink]

  followersCount: Int!
  followingCount: Int!
  publicationsCount: Int!

  verified: Boolean
  createdAt: Int!
  updatedAt: Int!
}


####################
#     INPUTS       #
####################

input UserInput {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String

  socialLinks: [SocialLinkInput!]
}

input UserByInput {
  address: String
}

input UpdateUserInput {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLinkInput!]
}

input SocialLinkInput {
  platform: String
  url: String
}


####################
#      QUERIES     #
####################

extend type Query {
  user(address: String!): User
}


####################
#     MUTATIONS    #
####################

extend type Mutation {
  createUser(input: UserInput!): User!
  updateUser(input: UpdateUserInput!): User!
}

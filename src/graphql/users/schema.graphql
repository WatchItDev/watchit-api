###########################
#      USERS SCHEMA       #
###########################

####################
#      TYPES       #
####################

type SocialLink {
  platform: String!
  url: String!
}

type User {
  id: String!
  address: String!
  email: String!
  username: String!
  displayName: String!
  bio: String!
  profilePicture: String!
  coverPicture: String!
  socialLinks: [SocialLink!]
  xpBalance: Int!
  xpTotal:   Int!
  currentRank: String!

  followersCount: Int!
  followingCount: Int!
  publicationsCount: Int!
  bookmarksCount:    Int!

  verified: Boolean!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}


####################
#     INPUTS       #
####################

input SocialLinkInput {
  platform: String!        @constraint(minLength: 1)
  url:      String!        @constraint(format: "uri")
}

input UserInput {
  address:        String!          @constraint(minLength: 1)
  username:       String!          @constraint(minLength: 3, maxLength: 15)
  displayName:    String!          @constraint(minLength: 1, maxLength: 30)
  bio:            String!          @constraint(minLength: 10, maxLength: 200)
  profilePicture: String           @constraint(minLength: 1)
  coverPicture:   String           @constraint(minLength: 1)
  socialLinks:    [SocialLinkInput!]
}

input UpdateUserInput {
  username:       String          @constraint(minLength: 3, maxLength: 15)
  displayName:    String          @constraint(minLength: 1, maxLength: 30)
  bio:            String          @constraint(minLength: 10, maxLength: 200)
  profilePicture: String          @constraint(minLength: 1)
  coverPicture:   String          @constraint(minLength: 1)
  socialLinks:    [SocialLinkInput!]
}

input UserByInput {
  address: String!            @constraint(minLength: 1)
  idSession: String
}

####################
#      QUERIES     #
####################

extend type Query {
  getUser(input: UserByInput!): User
  getUsers(
    query: String!
    limit:  Int              @constraint(min: 1, max: 100)
  ): [User!]!
  getUserFollowers(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [User!]!
  getUserFollowing(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [User!]!
  getUserBookmarks(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [Post!]!
}

####################
#     MUTATIONS    #
####################

extend type Mutation {
  createUser(input: UserInput!): User!
  updateUser(input: UpdateUserInput!): User!
}

###########################
#      USERS SCHEMA       #
###########################

####################
#      TYPES       #
####################

type SocialLink {
  platform: String!
  url: String!
}

type User {
  address: String!
  username: String!
  displayName: String!
  bio: String!
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLink!]

  followersCount: Int!
  followingCount: Int!
  publicationsCount: Int!
  bookmarksCount:    Int!

  verified: Boolean
  createdAt: Timestamp!
  updatedAt: Timestamp!
}


####################
#     INPUTS       #
####################

input SocialLinkInput {
  platform: String!        @constraint(minLength: 1)
  url:      String!        @constraint(format: "uri")
}

input UserInput {
  address:        String!          @constraint(minLength: 1)
  username:       String!          @constraint(minLength: 3, maxLength: 30)
  displayName:    String!          @constraint(minLength: 1, maxLength: 50)
  bio:            String!          @constraint(maxLength: 10)
  profilePicture: String          @constraint(format: "uri")
  coverPicture:   String          @constraint(format: "uri")
  socialLinks:    [SocialLinkInput!]!
}

input UpdateUserInput {
  address:        String!          @constraint(minLength: 1)
  username:       String          @constraint(minLength: 3, maxLength: 30)
  displayName:    String          @constraint(minLength: 1, maxLength: 50)
  bio:            String          @constraint(maxLength: 160)
  profilePicture: String          @constraint(format: "uri")
  coverPicture:   String          @constraint(format: "uri")
  socialLinks:    [SocialLinkInput!]
}

input UserByInput {
  address: String!            @constraint(minLength: 1)
}

####################
#      QUERIES     #
####################

extend type Query {
  getUser(address: String!): User
  getUsers(
    prefix: String!          @constraint(minLength: 1)
    limit:  Int              @constraint(min: 1, max: 100)
  ): [User!]!
  getUserFollowers(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [User!]!
  getUserFollowing(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [User!]!
  getUserBookmarks(
    address: String!          @constraint(minLength: 1)
    limit:   Int             @constraint(min: 1, max: 100)
  ): [Post!]!
}

####################
#     MUTATIONS    #
####################

extend type Mutation {
  createUser(input: UserInput!): User!
  updateUser(input: UpdateUserInput!): User!
}

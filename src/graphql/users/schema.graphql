###########################
#      USERS SCHEMA       #
###########################

####################
#      TYPES       #
####################

type SocialLink {
  platform: String
  url: String
}

type User {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLink]

  #–– raw counts ––

  followersCount: Int!
  followingCount: Int!
  publicationsCount: Int!
  bookmarksCount:    Int!

  #–– edges (resolve only when needed) ––
  followers:    [User!]!
  following:    [User!]!
  publications: [Post!]!
  bookmarks:    [Post!]!

  verified: Boolean
  createdAt: Int!
  updatedAt: Int!
}


####################
#     INPUTS       #
####################

input UserInput {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String

  socialLinks: [SocialLinkInput!]
}

input UserByInput {
  address: String
}

input UpdateUserInput {
  address: String!
  username: String
  displayName: String
  bio: String
  profilePicture: String
  coverPicture: String
  socialLinks: [SocialLinkInput!]
}

input SocialLinkInput {
  platform: String
  url: String
}


####################
#      QUERIES     #
####################

extend type Query {
  user(address: String!): User

  getUsers(prefix: String!, limit: Int): [User!]!
}


####################
#     MUTATIONS    #
####################

extend type Mutation {
  createUser(input: UserInput!): User!
  updateUser(input: UpdateUserInput!): User!
}

###########################
#        POSTS            #
###########################
####################
#     TYPES        #
####################

type MediaAttachment {
  id: Int!
  url: String
  cid: String!
  title: String
  type: String!
}

type Post {
  id: Int!
  title: String!
  body: String!
  base: BaseContent!
}

####################
#     INPUTS       #
####################

input HidePostInput {
  postId: Int! @constraint(min: 1)
}

input CreatePostInput {
  title: String! @constraint(minLength: 1, maxLength: 100)
  body: String! @constraint(minLength: 10)
  visibility: VisibilitySetting!
}

input UpdatePostInput {
  id: Int! @constraint(min: 1)
  title: String @constraint(minLength: 1, maxLength: 100)
  body: String @constraint(minLength: 10)
  visibility: VisibilitySetting
}

input PostByIdentifierInput @oneOf {
  id: Int
}

input PostFilterInput {
  id: Int
  userId: Int
}

####################
#      QUERIES     #
####################

extend type Query {
  getPost(input: PostByIdentifierInput!): Post
  getPosts(input: PostFilterInput!, pagination: PaginationInput): [Post!]!
  # getPostsByAuthor(
  #   author: String! @constraint(minLength: 1)
  #   limit: Int @constraint(min: 1, max: 100)
  # ): [Post!]!
}

####################
#     MUTATIONS    #
####################

extend type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(input: UpdatePostInput!): Post!
  hidePost(input: HidePostInput!): Boolean
  # incrementPostView(postId: String! @constraint(minLength: 1)): Post!
}
